<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Progress Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0b;
  --surface: #111114;
  --card: #17171c;
  --border: #222228;
  --gold: #c9a84c;
  --blue: #3b82f6;
  --green: #22c55e;
  --red: #ef4444;
  --text: #f0f0f0;
  --muted: #6b6b7a;
  --subtle: #2a2a32;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

.app { max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }

/* ── Header ── */
header {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 16px;
}
header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.2rem, 6vw, 3.8rem);
  letter-spacing: 0.04em; line-height: 1;
}
header h1 span { color: var(--gold); }
header p { color: var(--muted); font-size: 0.78rem; margin-top: 6px;
  font-family: 'DM Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; }

.date-badge {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 16px; text-align: right;
}
.date-badge strong { display: block; font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem; color: var(--gold); }
.date-badge span { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); }

/* ── Mission ── */
.mission {
  background: rgba(201,168,76,0.07); border: 1px solid rgba(201,168,76,0.25);
  border-left: 4px solid var(--gold); border-radius: 8px;
  padding: 18px 22px; margin-bottom: 36px;
  font-size: 0.92rem; color: #d4bc7a; font-style: italic; line-height: 1.6;
}
.mission strong {
  font-style: normal; color: var(--gold); font-family: 'DM Mono', monospace;
  font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
  display: block; margin-bottom: 6px;
}

/* ── Section label ── */
.section-label {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.section-label span {
  font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted); white-space: nowrap;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Cards ── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
}
.card-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.06em;
  color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
.dot.blue { background: var(--blue); }
.dot.green { background: var(--green); }

/* ── Grids ── */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }

/* ── Rings ── */
.rings-row { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 24px; padding: 10px 0; }
.ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ring-container { position: relative; width: 100px; height: 100px; }
.ring-svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--subtle); stroke-width: 8; }
.ring-fill { fill: none; stroke-width: 8; stroke-linecap: round;
  stroke-dasharray: 263.9; stroke-dashoffset: 263.9;
  transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1); }
.ring-label-inner { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; }
.ring-pct { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--text); line-height: 1; }
.ring-sub { font-family: 'DM Mono', monospace; font-size: 0.55rem; color: var(--muted);
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
.ring-name { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); }

/* ── Progress bars ── */
.bar-wrap { margin-bottom: 12px; }
.bar-meta { display: flex; justify-content: space-between; margin-bottom: 5px; }
.bar-label { font-size: 0.82rem; color: #b0b0be; }
.bar-pct { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--muted); }
.bar-track { height: 6px; background: var(--subtle); border-radius: 99px;
  overflow: hidden; cursor: pointer; position: relative; }
.bar-track.no-click { cursor: default; }
.bar-fill { height: 100%; border-radius: 99px; background: var(--gold);
  transition: width 0.5s ease; }
.bar-fill.blue { background: var(--blue); }
.bar-fill.green { background: var(--green); }
.bar-fill.multi { background: linear-gradient(90deg, var(--blue), var(--green)); }

/* ── Checklist ── */
.checklist { list-style: none; }
.checklist li {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid #1e1e24;
  cursor: pointer; transition: color 0.15s;
}
.checklist li:last-child { border-bottom: none; }
.check-box {
  width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; margin-top: 1px;
  border: 1.5px solid var(--muted); display: flex; align-items: center;
  justify-content: center; transition: all 0.15s;
}
.checklist li.done .check-box { background: var(--gold); border-color: var(--gold); }
.checklist li.done .check-box::after { content: '✓'; font-size: 10px; color: #000; font-weight: 700; }
.checklist li span { font-size: 0.83rem; color: #b0b0be; line-height: 1.4; }
.checklist li.done span { text-decoration: line-through; color: var(--muted); }

/* ── Stat box ── */
.stat-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 10px;
}
.stat-label { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.55rem;
  letter-spacing: 0.04em; color: var(--text); }
.stat-value.gold { color: var(--gold); }
.stat-value.blue { color: var(--blue); }
.stat-sub { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }

/* ── Inputs ── */
.field-label { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
input[type=number], textarea {
  background: var(--subtle); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.85rem;
  padding: 8px 12px; outline: none; transition: border-color 0.2s;
}
input[type=number] { width: 100%; text-align: left; }
input[type=number]:focus, textarea:focus { border-color: var(--gold); }
input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }
textarea { width: 100%; resize: vertical; min-height: 80px; line-height: 1.5;
  font-family: 'DM Sans', sans-serif; font-size: 0.85rem; }

.inline-row { display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; gap: 10px; }
.inline-row label { font-size: 0.8rem; color: #b0b0be; }
.inline-row input { width: 90px; text-align: center; }

/* ── Tags ── */
.tags { margin-top: 10px; }
.tag { display: inline-block; border-radius: 4px; padding: 2px 8px;
  font-size: 0.68rem; font-family: 'DM Mono', monospace; margin: 2px;
  text-transform: uppercase; letter-spacing: 0.08em; }
.tag.gold { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); }
.tag.blue { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); color: var(--blue); }

/* ── Save status ── */
.save-status {
  font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted);
  letter-spacing: 0.1em; text-transform: uppercase;
  transition: color 0.3s;
}
.save-status.saving { color: var(--gold); }
.save-status.saved { color: var(--green); }
.save-status.error { color: var(--red); }

/* ── Divider ── */
hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

/* ── Section spacing ── */
.section { margin-bottom: 36px; }

/* ── Footer ── */
footer { text-align: center; padding-top: 24px; border-top: 1px solid var(--border); }
footer p { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted);
  letter-spacing: 0.1em; text-transform: uppercase; }

/* ── Loading ── */
.loading {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
}
.loading p { font-family: 'DM Mono', monospace; font-size: 0.8rem;
  color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--subtle);
  border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Setup screen ── */
.setup {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
}
.setup-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 40px; max-width: 480px; width: 100%;
}
.setup-card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem;
  letter-spacing: 0.06em; color: var(--text); margin-bottom: 8px; }
.setup-card p { font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
.setup-field { margin-bottom: 16px; }
.setup-btn {
  width: 100%; background: var(--gold); color: #000; border: none; border-radius: 8px;
  padding: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 1rem;
  letter-spacing: 0.1em; cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
}
.setup-btn:hover { opacity: 0.85; }
.setup-error { color: var(--red); font-size: 0.8rem; margin-top: 10px;
  font-family: 'DM Mono', monospace; }

@media (max-width: 600px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .rings-row { gap: 16px; }
}
</style>
</head>
<body>

<div id="root"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — paste your Supabase URL and anon key here
// ─────────────────────────────────────────────────────────────────────────────
const SUPABASE_URL  = "YOUR_SUPABASE_URL";
const SUPABASE_KEY  = "YOUR_SUPABASE_ANON_KEY";
const SETUP_NEEDED  = SUPABASE_URL === "YOUR_SUPABASE_URL";

// ─────────────────────────────────────────────────────────────────────────────
// Default state
// ─────────────────────────────────────────────────────────────────────────────
const DEFAULT = {
  study:         { invest:0, court:0, pros:0, gig:0 },
  careerChecks:  { c1:false,c2:false,c3:false,c4:false,c5:false,c6:false,c7:false },
  careerNotes:   "",
  currentWeight: "",
  pushupCount:   "",
  runMiles:      "",
  marathonPct:   0,
  fitnessChecks: { f1:false,f2:false,f3:false,f4:false,f5:false,f6:false },
  musicRevenue:  "",
  musicChecks:   { m1:false,m2:false,m3:false,m4:false,m5:false,m6:false },
  loanBal:       "",
  ccBal:         "",
  creditScore:   "",
  familyChecks:  { fam1:false,fam2:false,fam3:false,fam4:false,fam5:false },
  relocChecks:   { r1:false,r2:false,r3:false,r4:false,r5:false },
  relocPct:      0,
};

// ─────────────────────────────────────────────────────────────────────────────
// App state
// ─────────────────────────────────────────────────────────────────────────────
let sb = null;
let state = JSON.parse(JSON.stringify(DEFAULT));
let saveTimer = null;
let saveStatusTimeout = null;

// ─────────────────────────────────────────────────────────────────────────────
// Supabase helpers
// ─────────────────────────────────────────────────────────────────────────────
async function initSupabase(url, key) {
  sb = supabase.createClient(url, key);
}

async function loadFromDB() {
  const { data, error } = await sb.from("tracker").select("data").eq("id","main").single();
  if (error) throw error;
  return data?.data || {};
}

async function saveToDB(payload) {
  const { error } = await sb.from("tracker").upsert({ id:"main", data:payload, updated_at: new Date().toISOString() });
  if (error) throw error;
}

// ─────────────────────────────────────────────────────────────────────────────
// Render helpers
// ─────────────────────────────────────────────────────────────────────────────
function pct(val, max) { return Math.min(100, Math.max(0, (val/max)*100)); }
function clamp(v,a,b) { return Math.min(b, Math.max(a, v)); }

function checkPct(obj) {
  const vals = Object.values(obj);
  return vals.length ? (vals.filter(Boolean).length / vals.length) * 100 : 0;
}

function computed() {
  const studyAvg   = (state.study.invest + state.study.court + state.study.pros + state.study.gig) / 4;
  const careerPct  = (studyAvg * 0.5) + (checkPct(state.careerChecks) * 0.5);

  const wStart=257, wGoal=212;
  const wPct = state.currentWeight ? clamp(((wStart - parseFloat(state.currentWeight))/(wStart-wGoal))*100, 0, 100) : 0;
  const ppPct = state.pushupCount  ? clamp((parseFloat(state.pushupCount)/70)*100, 0, 100) : 0;
  const fitPct = (wPct*0.35) + (ppPct*0.2) + (state.marathonPct*0.2) + (checkPct(state.fitnessChecks)*0.25);

  const revPct   = state.musicRevenue ? clamp((parseFloat(state.musicRevenue)/1000)*100,0,100) : 0;
  const musicPct = (revPct*0.6) + (checkPct(state.musicChecks)*0.4);

  const loanPct  = state.loanBal ? clamp(((16000-parseFloat(state.loanBal))/16000)*100,0,100) : 0;
  const ccPct    = state.ccBal   ? clamp(((24000-parseFloat(state.ccBal))/24000)*100,0,100) : 0;
  const finPct   = (loanPct*0.4) + (ccPct*0.6);

  return { careerPct, fitPct, musicPct, finPct, wPct, ppPct, revPct, loanPct, ccPct };
}

// ─────────────────────────────────────────────────────────────────────────────
// DOM helpers
// ─────────────────────────────────────────────────────────────────────────────
function setRing(id, pctVal) {
  const circ = 263.9;
  const offset = circ - (circ * clamp(pctVal,0,100) / 100);
  const el = document.getElementById("ring-"+id);
  const lbl = document.getElementById("rpct-"+id);
  if (el)  el.style.strokeDashoffset = offset;
  if (lbl) lbl.textContent = Math.round(pctVal) + "%";
}

function setBar(id, pctVal) {
  const fill = document.getElementById("bf-"+id);
  const lbl  = document.getElementById("bp-"+id);
  if (fill) fill.style.width = clamp(pctVal,0,100) + "%";
  if (lbl)  lbl.textContent  = Math.round(clamp(pctVal,0,100)) + "%";
}

function updateAll() {
  const c = computed();
  setRing("career",  c.careerPct);
  setRing("fitness", c.fitPct);
  setRing("music",   c.musicPct);
  setRing("finance", c.finPct);

  setBar("invest",   state.study.invest);
  setBar("court",    state.study.court);
  setBar("pros",     state.study.pros);
  setBar("gig",      state.study.gig);
  setBar("weight",   c.wPct);
  setBar("marathon", state.marathonPct);
  setBar("pushup",   c.ppPct);
  setBar("rev",      c.revPct);
  setBar("loan",     c.loanPct);
  setBar("cc",       c.ccPct);
  setBar("reloc",    state.relocPct);

  // push-up display
  const ppd = document.getElementById("bp-pushup");
  if (ppd) ppd.textContent = state.pushupCount ? Math.round(state.pushupCount) : "0";

  // credit score
  const cs = document.getElementById("credit-display");
  if (cs) cs.textContent = state.creditScore || "650";
}

function triggerSave() {
  clearTimeout(saveTimer);
  setSaveStatus("saving");
  saveTimer = setTimeout(async () => {
    try {
      await saveToDB(state);
      setSaveStatus("saved");
    } catch(e) {
      setSaveStatus("error");
    }
  }, 800);
}

function setSaveStatus(status) {
  const el = document.getElementById("save-status");
  if (!el) return;
  el.className = "save-status " + status;
  const labels = { saving:"⟳ saving...", saved:"✓ saved", error:"✗ save failed", "":"Daily Tracker" };
  el.textContent = labels[status] || "Daily Tracker";
  clearTimeout(saveStatusTimeout);
  if (status === "saved" || status === "error") {
    saveStatusTimeout = setTimeout(() => {
      el.className = "save-status";
      el.textContent = "Daily Tracker";
    }, 2500);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Event handlers
// ─────────────────────────────────────────────────────────────────────────────
function onBarClick(e, key) {
  const rect = e.currentTarget.getBoundingClientRect();
  const p = Math.round(clamp(((e.clientX - rect.left) / rect.width) * 100, 0, 100));
  if (key.includes(".")) {
    const [group, field] = key.split(".");
    state[group][field] = p;
  } else {
    state[key] = p;
  }
  updateAll();
  triggerSave();
}

function onCheck(group, key) {
  state[group][key] = !state[group][key];
  const li = document.querySelector(`[data-check="${group}.${key}"]`);
  if (li) li.classList.toggle("done", state[group][key]);
  updateAll();
  triggerSave();
}

function onNumberInput(field, value) {
  state[field] = value;
  updateAll();
  triggerSave();
}

function onTextInput(field, value) {
  state[field] = value;
  triggerSave();
}

// ─────────────────────────────────────────────────────────────────────────────
// HTML Builders
// ─────────────────────────────────────────────────────────────────────────────
function ring(id, color, label, sublabel) {
  return `
  <div class="ring-wrap">
    <div class="ring-container">
      <svg class="ring-svg" width="100" height="100" viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="42"/>
        <circle class="ring-fill" id="ring-${id}" cx="50" cy="50" r="42" style="stroke:${color}"/>
      </svg>
      <div class="ring-label-inner">
        <span class="ring-pct" id="rpct-${id}">0%</span>
        <span class="ring-sub">${sublabel}</span>
      </div>
    </div>
    <span class="ring-name">${label}</span>
  </div>`;
}

function bar(id, label, colorClass="", clickable=true) {
  return `
  <div class="bar-wrap">
    <div class="bar-meta">
      <span class="bar-label">${label}</span>
      <span class="bar-pct" id="bp-${id}">0%</span>
    </div>
    <div class="bar-track ${clickable ? '' : 'no-click'}" ${clickable ? `onclick="onBarClick(event,'${id}')"` : ''}>
      <div class="bar-fill ${colorClass}" id="bf-${id}" style="width:0%"></div>
    </div>
  </div>`;
}

function checkItem(group, key, label) {
  const done = state[group][key];
  return `
  <li class="${done?'done':''}" data-check="${group}.${key}" onclick="onCheck('${group}','${key}')">
    <div class="check-box"></div>
    <span>${label}</span>
  </li>`;
}

function statBox(label, value, cls="", sub="") {
  return `
  <div class="stat-box">
    <div class="stat-label">${label}</div>
    <div class="stat-value ${cls}">${value}</div>
    ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
  </div>`;
}

function numField(label, field, placeholder, min="0", max="99999", step="1") {
  return `
  <div>
    <label class="field-label">${label}</label>
    <input type="number" value="${state[field]||''}" placeholder="${placeholder}"
      min="${min}" max="${max}" step="${step}"
      oninput="onNumberInput('${field}',this.value)"/>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Full render
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  const today = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});

  document.getElementById("root").innerHTML = `
  <div class="app">

    <header>
      <div>
        <h1>YOUR <span>PROGRESS</span></h1>
        <p>Three Lanes · One Mission · All In</p>
      </div>
      <div class="date-badge">
        <strong>${today}</strong>
        <span id="save-status" class="save-status">Daily Tracker</span>
      </div>
    </header>

    <div class="mission">
      <strong>Core Mission</strong>
      Becoming a stronger man for your family while building long-term stability —
      as a father, a federal investigator, a disciplined man, and a music creator.
    </div>

    <!-- Score Rings -->
    <div class="section">
      <div class="section-label"><span>Weekly Score</span></div>
      <div class="card">
        <div class="rings-row">
          ${ring("career",  "#c9a84c", "1811 Path",           "career" )}
          ${ring("fitness", "#22c55e", "Body Transformation",  "fitness")}
          ${ring("music",   "#3b82f6", "Studio Growth",        "music"  )}
          ${ring("finance", "#c9a84c", "Debt Elimination",     "debt"   )}
        </div>
      </div>
    </div>

    <hr/>

    <!-- CAREER -->
    <div class="section">
      <div class="section-label"><span>Lane 01 — Career · 1811 Path</span></div>
      <div class="grid-2">

        <div class="card">
          <div class="card-title"><div class="dot"></div> Study Progress</div>
          ${bar("invest",   "Federal Investigative Work", "",      true)}
          ${bar("court",    "Court Procedures",           "",      true)}
          ${bar("pros",     "Prosecutorial Standards",    "",      true)}

// ─────────────────────────────────────────────────────────────────────────────
// Setup screen (when keys not yet configured)
// ─────────────────────────────────────────────────────────────────────────────
function renderSetup() {
  document.getElementById("root").innerHTML = `
  <div class="setup">
    <div class="setup-card">
      <h2>Connect Supabase</h2>
      <p>Enter your Supabase project URL and anon key to connect your tracker to the cloud. Your data will sync across every device.</p>
      <div class="setup-field">
        <label class="field-label">Supabase Project URL</label>
        <input type="text" id="setup-url" placeholder="https://xxxx.supabase.co" style="width:100%;padding:10px 12px;border-radius:8px;font-family:'DM Mono',monospace;font-size:0.82rem"/>
      </div>
      <div class="setup-field">
        <label class="field-label">Anon Public Key</label>
        <input type="text" id="setup-key" placeholder="eyJhbGciOiJIUzI1NiIs..." style="width:100%;padding:10px 12px;border-radius:8px;font-family:'DM Mono',monospace;font-size:0.82rem"/>
      </div>
      <button class="setup-btn" onclick="handleSetup()">Connect & Load Tracker</button>
      <div id="setup-error" class="setup-error"></div>
    </div>
  </div>`;
}

async function handleSetup() {
  const url = document.getElementById("setup-url").value.trim();
  const key = document.getElementById("setup-key").value.trim();
  const errEl = document.getElementById("setup-error");
  if (!url || !key) { errEl.textContent = "Please enter both fields."; return; }

  errEl.textContent = "";
  document.querySelector(".setup-btn").textContent = "Connecting...";

  try {
    await initSupabase(url, key);
    const saved = await loadFromDB();
    state = { ...JSON.parse(JSON.stringify(DEFAULT)), ...saved };
    // Persist keys in localStorage for next visit
    localStorage.setItem("sb_url", url);
    localStorage.setItem("sb_key", key);
    render();
  } catch(e) {
    document.querySelector(".setup-btn").textContent = "Connect & Load Tracker";
    errEl.textContent = "Connection failed. Check your URL and key.";
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
async function boot() {
  document.getElementById("root").innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading tracker...</p>
    </div>`;

  // Check if keys are hardcoded in the file
  if (!SETUP_NEEDED) {
    try {
      await initSupabase(SUPABASE_URL, SUPABASE_KEY);
      const saved = await loadFromDB();
      state = { ...JSON.parse(JSON.stringify(DEFAULT)), ...saved };
      render();
      return;
    } catch(e) {}
  }

  // Check if keys are saved in localStorage (returning visitor)
  const cachedUrl = localStorage.getItem("sb_url");
  const cachedKey = localStorage.getItem("sb_key");
  if (cachedUrl && cachedKey) {
    try {
      await initSupabase(cachedUrl, cachedKey);
      const saved = await loadFromDB();
      state = { ...JSON.parse(JSON.stringify(DEFAULT)), ...saved };
      render();
      return;
    } catch(e) {
      localStorage.removeItem("sb_url");
      localStorage.removeItem("sb_key");
    }
  }

  // Show setup screen
  renderSetup();
}

boot();
</script>
